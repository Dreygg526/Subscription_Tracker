<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#12314f" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1926" />
    <title>Offline</title>
    <!--
      This page is a separate document and cannot import globals.css, so the
      palette is duplicated here by hand. If the tokens in globals.css change,
      change these too -- and bump the cache name in sw.js, or installed users
      keep the old copy forever.
    -->
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f9fc;
        --ink: #16354f;
        --muted: #6c8299;
        --brand: #2f6fae;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0c1926;
          --ink: #e8f0f8;
          --muted: #93a9be;
          --brand: #6aa6de;
        }
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.55;
        max-width: 320px;
      }
      button {
        min-height: 48px;
        padding: 14px 26px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Your streak is safe. Reconnect and log today's dose — it'll still count.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
